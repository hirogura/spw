<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPW - Password Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen">
    <div class="auth-box">
      <h2>SPW</h2>
      <div id="auth-setup">
        <p>初回アクセスです。パスワードを設定してください。</p>
        <input type="password" id="setup-password" placeholder="パスワード">
        <input type="password" id="setup-password-confirm" placeholder="パスワード（確認）">
        <button id="btn-setup" class="btn-primary">設定</button>
      </div>
      <div id="auth-login" style="display:none">
        <p>パスワードを入力してください。</p>
        <input type="password" id="login-password" placeholder="パスワード">
        <button id="btn-login" class="btn-primary">ログイン</button>
      </div>
      <div id="auth-error" class="auth-error" style="display:none"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>SPW</h2>
        <span id="app-version" class="version-label"></span>
        <button id="btn-export" class="btn-small" title="エクスポート">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="btn-import" class="btn-small" title="インポート">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button id="btn-add-category" class="btn-small" title="カテゴリー追加">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="検索...">
      </div>
      <div id="category-list"></div>
      <div class="sidebar-footer">
        <button id="btn-update" class="btn-small" title="GitHubから最新版に更新">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          アップデート
        </button>
        <button id="btn-change-pw" class="btn-small" title="パスワード変更">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          パスワード変更
        </button>
        <button id="btn-restart" class="btn-small" title="SPWサービスを再起動">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          再起動
        </button>
        <button id="btn-logout" class="btn-small" title="ログアウト">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          ログアウト
        </button>
        <button id="btn-sync" class="btn-small" title="別PCと同期">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          同期
        </button>
      </div>
    </aside>
    <main id="main-content">
      <div id="welcome-screen">
        <p>カテゴリーとカードを選択してください</p>
      </div>
      <div id="card-detail" style="display:none">
        <div class="detail-header">
          <input type="text" id="detail-card-name" class="card-name-input">
          <div class="detail-actions">
            <select id="detail-category-select" class="category-select" title="カテゴリー変更"></select>
            <button id="btn-add-field" class="btn-small">フィールド追加</button>
            <button id="btn-delete-card" class="btn-small btn-danger">カード削除</button>
            <button id="btn-save-card" class="btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              保存
            </button>
          </div>
        </div>
        <div id="detail-fields"></div>
        <div id="detail-memo">
          <label for="detail-memo-input">メモ</label>
          <textarea id="detail-memo-input" placeholder="自由にメモを書けます"></textarea>
        </div>
      </div>
    </main>
  </div>

  <div id="export-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>エクスポート</h3>
      <p>暗号化ファイルをダウンロードします</p>
      <div class="modal-actions">
        <button id="btn-export-cancel" class="btn-small">キャンセル</button>
        <button id="btn-export-confirm" class="btn-primary">ダウンロード</button>
      </div>
    </div>
  </div>

  <div id="import-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>インポート</h3>
      <p>パスワードを入力してください</p>
      <input type="password" id="import-password" placeholder="パスワード">
      <input type="file" id="import-file" accept=".zip" style="margin-bottom:12px;color:#e0e0e0">
      <div class="modal-actions">
        <button id="btn-import-cancel" class="btn-small">キャンセル</button>
        <button id="btn-import-confirm" class="btn-primary">インポート</button>
      </div>
    </div>
  </div>

  <div id="change-pw-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>パスワード変更</h3>
      <input type="password" id="current-password" placeholder="現在のパスワード">
      <input type="password" id="new-password" placeholder="新しいパスワード">
      <input type="password" id="new-password-confirm" placeholder="新しいパスワード（確認）">
      <div class="modal-actions">
        <button id="btn-change-pw-cancel" class="btn-small">キャンセル</button>
        <button id="btn-change-pw-confirm" class="btn-primary">変更</button>
      </div>
    </div>
  </div>

  <div id="sync-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>🔄 SPW 同期</h3>
      <p>別PCの SPW と1日1回・片方向で同期します（予備機用途・同期先は1箇所のみ）。暗号化ファイルのみを送受信します。相手PCも最新版の SPW に更新し、両PCのマスターパスワードを同一にしてください。</p>
      <div class="sync-row">
        <label>役割</label>
        <div class="sync-role">
          <button id="sync-role-source">同期元（送る側）</button>
          <button id="sync-role-dest">同期先（受ける側）</button>
        </div>
      </div>
      <div class="sync-desc" id="sync-role-desc"></div>
      <div class="sync-row">
        <label>同期相手</label>
        <select id="sync-peer"><option value="">-- 選択してください --</option></select>
      </div>
      <div class="sync-row">
        <label>同期時刻</label>
        <input type="time" id="sync-time" value="03:00">
        <span class="sync-hint">1日1回この時刻以降に自動同期</span>
      </div>
      <div id="sync-status">読み込み中…</div>
      <div class="modal-actions">
        <button id="btn-sync-close" class="btn-small">閉じる</button>
        <button id="btn-sync-now" class="btn-primary">⚡ 今すぐ同期</button>
        <button id="btn-sync-save" class="btn-primary">保存</button>
        <button id="btn-sync-stop" class="btn-small">同期を停止</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
